interface:
  display_name: "数学竞赛解题 Agent"
  short_description: "独立求解、审查并修补竞赛证明"
  default_prompt: "Use $math-olympiad as the proof core. Respect the requested source policy, use $math-olympiad-search only when sourcing or local retrieval is allowed and useful, and use $math-content-pipeline only for extraction, batch organization, or artifact production. Independently verify every key step and distinguish statement capture, source evidence, proof validity, and rendered delivery. Present the statement, explicit answer, rigorous solution, key method, edge-case checks, difficulty, confidence, and unresolved issues."
